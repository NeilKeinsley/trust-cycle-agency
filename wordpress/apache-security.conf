# Web-server hardening for the content admin (enabled by the Dockerfile).
# The PHP half is wordpress/mu-plugins/tca-security.php. Why each line is
# here: docs/SECURITY.md.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
	# Railway terminates HTTPS in front of this container, so the browser only
	# ever sees these over HTTPS.
	Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
	# The admin may frame itself (the block editor and media dialogs do); no
	# other site may frame it. A full script policy is not practical for
	# wp-admin, which is built on inline scripts.
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set Content-Security-Policy "frame-ancestors 'self'"
	Header always unset X-Powered-By
	Header unset X-Powered-By
</IfModule>

# Entry points nobody needs here. xmlrpc.php: the old remote-publishing API,
# a favourite for password guessing. install.php: WP-CLI installs WordPress at
# first boot. The rest only tell a visitor what is running.
<FilesMatch "^(xmlrpc\.php|readme\.html|license\.txt|wp-config-sample\.php|install\.php)$">
	Require all denied
</FilesMatch>

# Hidden files and editor/backup leftovers (.git, .env, wp-config.php.bak, ...).
<FilesMatch "(^\.|\.(bak|old|orig|save|swp|sql|log)$|~$)">
	Require all denied
</FilesMatch>

<Directory /var/www/html>
	Options -Indexes
</Directory>

# Uploads are pictures. Nothing in that folder is ever run as code, whatever
# its name: an uploaded script is the classic way a file upload becomes a
# takeover.
<Directory /var/www/html/wp-content/uploads>
	<FilesMatch "\.(php[0-9]?|phtml|phar|pht|cgi|pl|py|sh)$">
		Require all denied
	</FilesMatch>
	<IfModule mod_php.c>
		php_admin_flag engine off
	</IfModule>
</Directory>
